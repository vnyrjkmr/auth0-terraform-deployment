name: Deploy Auth0 Infrastructure

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        default: 'dev'
        type: choice
        options:
        - dev
        - qa
        - prod
      force_apply:
        description: 'Force apply without plan approval'
        required: false
        default: false
        type: boolean

env:
  TF_VERSION: '1.5.7'
  TF_IN_AUTOMATION: true
  TF_INPUT: false

jobs:
  # Job to determine which environment to deploy based on branch/trigger
  determine-environment:
    name: 'Determine Environment'
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.env.outputs.environment }}
      tf_vars_file: ${{ steps.env.outputs.tf_vars_file }}
    steps:
      - name: Determine environment
        id: env
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ENVIRONMENT="${{ github.event.inputs.environment }}"
          elif [ "${{ github.ref }}" = "refs/heads/main" ]; then
            ENVIRONMENT="prod"
          elif [ "${{ github.ref }}" = "refs/heads/qa" ] || [ "${{ github.ref }}" = "refs/heads/release/*" ]; then
            ENVIRONMENT="qa"
          elif [ "${{ github.ref }}" = "refs/heads/develop" ] || [ "${{ github.ref }}" = "refs/heads/dev" ]; then
            ENVIRONMENT="dev"
          elif [ "${{ github.base_ref }}" = "main" ]; then
            ENVIRONMENT="qa"
          elif [ "${{ github.base_ref }}" = "qa" ] || [[ "${{ github.base_ref }}" == release/* ]]; then
            ENVIRONMENT="qa"
          elif [ "${{ github.base_ref }}" = "develop" ]; then
            ENVIRONMENT="dev"
          else
            ENVIRONMENT="dev"
          fi
          
          echo "environment=$ENVIRONMENT" >> $GITHUB_OUTPUT
          echo "tf_vars_file=${ENVIRONMENT}.tfvars" >> $GITHUB_OUTPUT
          echo "🎯 Deploying to environment: $ENVIRONMENT"

  # Terraform Plan Job
  terraform-plan:
    name: 'Terraform Plan'
    runs-on: ubuntu-latest
    needs: determine-environment
    environment: ${{ needs.determine-environment.outputs.environment }}
    
    outputs:
      plan-exitcode: ${{ steps.plan.outputs.exitcode }}
      
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure Auth0 Credentials
        env:
          AUTH0_DOMAIN: ${{ secrets.AUTH0_DOMAIN }}
          AUTH0_CLIENT_ID: ${{ secrets.AUTH0_CLIENT_ID }}
          AUTH0_CLIENT_SECRET: ${{ secrets.AUTH0_CLIENT_SECRET }}
        run: |
          # Create terraform.tfvars with Auth0 credentials
          cat > terraform.tfvars << EOF
          auth0_domain = "$AUTH0_DOMAIN"
          auth0_client_id = "$AUTH0_CLIENT_ID"
          auth0_client_secret = "$AUTH0_CLIENT_SECRET"
          EOF

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Verify Auth0 Permissions
        shell: pwsh
        env:
          AUTH0_DOMAIN: ${{ secrets.AUTH0_DOMAIN }}
          AUTH0_CLIENT_ID: ${{ secrets.AUTH0_CLIENT_ID }}
          AUTH0_CLIENT_SECRET: ${{ secrets.AUTH0_CLIENT_SECRET }}
        run: |
          # Create a simplified version of verify-permissions.ps1 for CI
          $tokenRequest = @{
              Method  = "POST"
              Uri     = "https://$env:AUTH0_DOMAIN/oauth/token"
              Body    = @{
                  client_id     = $env:AUTH0_CLIENT_ID
                  client_secret = $env:AUTH0_CLIENT_SECRET
                  audience      = "https://$env:AUTH0_DOMAIN/api/v2/"
                  grant_type    = "client_credentials"
              } | ConvertTo-Json
              Headers = @{
                  "Content-Type" = "application/json"
              }
          }
          
          try {
              $tokenResponse = Invoke-RestMethod @tokenRequest
              Write-Host "✅ Successfully obtained Auth0 access token" -ForegroundColor Green
              
              # Test a basic API call
              $headers = @{ "Authorization" = "Bearer $($tokenResponse.access_token)" }
              $clientsResponse = Invoke-RestMethod -Uri "https://$env:AUTH0_DOMAIN/api/v2/clients" -Headers $headers
              Write-Host "✅ Auth0 API permissions verified" -ForegroundColor Green
          } catch {
              Write-Host "❌ Failed to verify Auth0 permissions: $_" -ForegroundColor Red
              exit 1
          }

      - name: Terraform Plan
        id: plan
        run: |
          set +e
          terraform plan -var-file="${{ needs.determine-environment.outputs.tf_vars_file }}" -out=tfplan -detailed-exitcode
          echo "exitcode=$?" >> $GITHUB_OUTPUT
          
          # Generate human-readable plan
          terraform show -no-color tfplan > plan-output.txt

      - name: Upload Plan Artifact
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-${{ needs.determine-environment.outputs.environment }}
          path: |
            tfplan
            plan-output.txt
          retention-days: 7

      - name: Comment Plan on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('plan-output.txt', 'utf8');
            const maxLength = 65000; // GitHub comment limit
            const truncatedPlan = plan.length > maxLength 
              ? plan.substring(0, maxLength) + '\n... (truncated)'
              : plan;

            const output = `
            ## 🏗️ Terraform Plan - ${{ needs.determine-environment.outputs.environment }}
            
            <details>
            <summary>Click to expand plan</summary>
            
            \`\`\`hcl
            ${truncatedPlan}
            \`\`\`
            
            </details>
            
            **Plan Status:** ${${{ steps.plan.outputs.exitcode }} == 0 ? '✅ No changes' : ${{ steps.plan.outputs.exitcode }} == 2 ? '📋 Changes detected' : '❌ Error'}
            **Environment:** ${{ needs.determine-environment.outputs.environment }}
            `;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });

  # Terraform Apply Job
  terraform-apply:
    name: 'Terraform Apply'
    runs-on: ubuntu-latest
    needs: [determine-environment, terraform-plan]
    environment: ${{ needs.determine-environment.outputs.environment }}
    
    # Only run apply on branch pushes, manual triggers, or when force_apply is true
    if: |
      (github.ref == 'refs/heads/main' && github.event_name == 'push') ||
      (github.ref == 'refs/heads/qa' && github.event_name == 'push') ||
      (startsWith(github.ref, 'refs/heads/release/') && github.event_name == 'push') ||
      (github.ref == 'refs/heads/develop' && github.event_name == 'push') ||
      (github.ref == 'refs/heads/dev' && github.event_name == 'push') ||
      (github.event_name == 'workflow_dispatch' && 
       (github.event.inputs.force_apply == 'true' || needs.terraform-plan.outputs.plan-exitcode == '2'))
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure Auth0 Credentials
        env:
          AUTH0_DOMAIN: ${{ secrets.AUTH0_DOMAIN }}
          AUTH0_CLIENT_ID: ${{ secrets.AUTH0_CLIENT_ID }}
          AUTH0_CLIENT_SECRET: ${{ secrets.AUTH0_CLIENT_SECRET }}
        run: |
          # Create terraform.tfvars with Auth0 credentials
          cat > terraform.tfvars << EOF
          auth0_domain = "$AUTH0_DOMAIN"
          auth0_client_id = "$AUTH0_CLIENT_ID"
          auth0_client_secret = "$AUTH0_CLIENT_SECRET"
          EOF

      - name: Terraform Init
        run: terraform init

      - name: Download Plan Artifact
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan-${{ needs.determine-environment.outputs.environment }}

      - name: Terraform Apply
        run: |
          echo "🚀 Applying Terraform plan for environment: ${{ needs.determine-environment.outputs.environment }}"
          terraform apply -auto-approve tfplan

      - name: Generate Outputs
        id: outputs
        run: |
          echo "## 🎉 Deployment Complete - ${{ needs.determine-environment.outputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Terraform Outputs" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          terraform output -no-color >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

      - name: Notify Success
        if: success()
        run: |
          echo "✅ Successfully deployed Auth0 infrastructure to ${{ needs.determine-environment.outputs.environment }}" 

      - name: Notify Failure  
        if: failure()
        run: |
          echo "❌ Failed to deploy Auth0 infrastructure to ${{ needs.determine-environment.outputs.environment }}"
          exit 1